# 参数配置演示：支持中文、嵌套结构及常见 YAML 语法
# 此文档仅用于编辑器预览，不代表真实服务或连接信息。
spring:
  application:
    name: 'SvMxlWFGqjIgVgBji_zjVxl'
  profiles:
    active: 'dev'
  datasource:
    url: 'jdbc:postgresql://db.example.test:5432/demo'
    username: demo_user
    password: 'DEMO_PASSWORD'
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  data:
    redis:
      host: cache.example.test
      port: 6379
      database: 0
      timeout: 2s
  kafka:
    bootstrap-servers:
      - broker-1.example.test:9092
      - broker-2.example.test:9092
    consumer:
      group-id: demo-consumers
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8081
  shutdown: graceful
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: [application/json, text/plain, text/html]

application:
  system: 'CAC'
  title: '参数管理演示'
  version: '1.0.0'
  homepage: https://app.example.test
  release-date: 2026-10-30
  features:
    audit: true
    debug: true
    experimental: false
  cors:
    allowed-origins:
      - https://console.example.test
      - http://localhost:5173
    allowed-methods: [GET, POST, PUT, DELETE]
  limits:
    request-per-second: 100
    burst-ratio: 1.5
    retry-delays: [100, 500, 1000]
  routes:
    - id: users
      path: /users/**
      target: https://users.example.test
      enabled: true
    - id: reports
      path: /reports/**
      target: https://reports.example.test
      enabled: false

logging:
  level:
    root: DEBUG
    org.springframework: INFO
  file:
    name: ./logs/application.log
  pattern:
    console: '%d{HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n'

management:
  endpoints:
    web:
      exposure:
        include: [health, info, prometheus]
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 0.1

# 锚点与别名：两个任务复用同一组请求配置，不使用自定义标签。
http-defaults: &httpDefaults
  connect-timeout: 3s
  read-timeout: 10s
  retries: 3
jobs:
  - name: sync-users
    cron: '0 */5 * * * *'
    http: *httpDefaults
  - name: refresh-reports
    cron: '0 0 * * * *'
    http: *httpDefaults

# 多行文本：| 保留换行，>- 将相邻文本行折叠为空格并去掉末尾换行。
templates:
  notification: |
    你好，配置已更新。
    请检查应用状态与监控指标。
  description: >-
    这是一段较长的说明，
    用于检查多行字符串的高亮与折叠效果。
  sql: |
    SELECT id, display_name
    FROM demo_users
    WHERE enabled = true
    ORDER BY id DESC;

# 标量与容器：演示整数、小数、科学计数、不同进制、空值和引号。
yaml-examples:
  integer: 42
  negative: -17
  decimal: 3.14159
  scientific: 6.02e+23
  hexadecimal: 0xFF
  octal: 0o755
  infinity: .inf
  not-a-number: .nan
  boolean: true
  null-value: null
  tilde-null: ~
  empty-value:
  empty-string: ''
  numeric-string: '00123'
  boolean-string: 'false'
  explicit-string: !!str 123
  quoted-text: "It's a YAML string: # stays text"
  escaped-text: "first line\nsecond line\t\"quoted\""
  unicode: '中文、emoji 🌈、符号 ©'
  empty-list: []
  empty-map: {}
  inline-map: { region: cn-east, weight: 0.8, enabled: true }
  mixed-list: [hello, 42, true, null]
  'key with spaces': '带空格的键名'
